spring.application.name=petsplace-backend
server.port=8080

# MySQL (XAMPP). The database "petsplace" must already exist in phpMyAdmin.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/petsplace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Creates the tables from src/main/resources/schema.sql every start (safe: uses IF NOT EXISTS)
spring.sql.init.mode=always
